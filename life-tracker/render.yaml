# Render Blueprint: веб-сервис (Docker) + управляемый Postgres + постоянный диск + cron.
# Импортируется через Render → New → Blueprint. Секреты с sync:false задаются в UI.
services:
  - type: web
    name: worksection
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /login
    disk:
      name: uploads
      mountPath: /app/public/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worksection-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # https://<ваш-домен>.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # AI / OAuth / push / telegram / почта — задать в UI по мере надобности:
      - { key: GEMINI_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }
      - { key: NEXT_PUBLIC_VAPID_PUBLIC_KEY, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_BOT_USERNAME, sync: false }
      - { key: TELEGRAM_WEBHOOK_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }

  # Плановый прогон каждые 15 минут: план дня в 10:00, просрочки, регулярные задачи.
  - type: cron
    name: worksection-cron
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "*/15 * * * *"
    dockerCommand: sh -c 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/run"'
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: worksection
          envVarKey: CRON_SECRET

databases:
  - name: worksection-db
    plan: basic-256mb
