<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  html, body { margin:0; padding:0; background:#0A130D; }
  body { font-family:'Manrope','Helvetica Neue',Arial,sans-serif; color:#E8EFE3; -webkit-font-smoothing:antialiased; }
  a { color:#A9D97F; text-decoration:none; }
  a:hover { color:#C6E89B; }
  ::selection { background:#C6E89B; color:#0A130D; }
  @keyframes navglow {
    0%, 100% { box-shadow: 0 0 10px 1px rgba(183,238,122,.45), 0 6px 22px 4px rgba(183,238,122,.25); }
    50%      { box-shadow: 0 0 16px 2px rgba(195,245,135,.65), 0 8px 30px 6px rgba(183,238,122,.35); }
  }
  @keyframes btnglow2 {
    0%, 100% { box-shadow: 0 0 8px 1px rgba(183,238,122,.45), 0 4px 16px 2px rgba(183,238,122,.22); }
    50%      { box-shadow: 0 0 12px 2px rgba(195,245,135,.60), 0 6px 22px 4px rgba(183,238,122,.32); }
  }
  @keyframes btnglow {
    0%, 100% { box-shadow: 0 0 18px 2px rgba(183,238,122,.60), 0 10px 46px 8px rgba(183,238,122,.42), 0 22px 80px 16px rgba(160,225,100,.28); }
    50%      { box-shadow: 0 0 26px 4px rgba(195,245,135,.85), 0 14px 60px 12px rgba(183,238,122,.58), 0 28px 100px 22px rgba(160,225,100,.38); }
  }
  .navscroll { scrollbar-width:none; -ms-overflow-style:none; }
  .navscroll::-webkit-scrollbar { display:none; height:0; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; flex-direction:column; background-color:#0A130D; background-image:radial-gradient(1200px 520px at 15% -60px, rgba(140,215,120,.34), transparent 68%), radial-gradient(1000px 460px at 70% -80px, rgba(95,191,160,.26), transparent 70%); background-repeat:no-repeat;">

  <header style="position:sticky; top:0; z-index:40; display:flex; height:56px; flex-shrink:0; align-items:center; gap:12px; padding:0 16px; background:rgba(10,19,13,.55); backdrop-filter:blur(12px); border-bottom:1px solid rgba(198,232,155,.10);">
    <a href="Workspace Board Dark.dc.html" style="display:flex; flex-shrink:0; align-items:center; gap:8px; color:#E8EFE3;">
      <span role="img" aria-label="team M" style="width:32px; height:32px; border-radius:8px; background-color:#131C15; background-image:url('logo.png'); background-size:contain; background-position:center; background-repeat:no-repeat; box-shadow:0 1px 2px rgba(0,0,0,.4); outline:1px solid rgba(0,0,0,.4);"></span>
      <span style="font-size:18px; font-weight:500; letter-spacing:-.02em;">Workspace</span>
    </a>
    <div class="navscroll" style="flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; padding:14px 0; margin:-14px 0;">
      <nav style="display:flex; align-items:center; gap:2px; overflow:visible;">
        <a href="Workspace Board Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:6px; padding:6px 10px; font-size:13px; font-weight:500; color:#8B9C86;"><i data-lucide="layout-dashboard" style="width:16px;height:16px"></i><span>Задачі</span></a>
        <a href="Planning Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:6px; padding:6px 10px; font-size:13px; font-weight:500; color:#8B9C86;"><i data-lucide="clipboard-list" style="width:16px;height:16px"></i><span>Планування</span></a>
        <a href="Projects Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:6px; padding:6px 10px; font-size:13px; font-weight:500; color:#8B9C86;"><i data-lucide="folder-kanban" style="width:16px;height:16px"></i><span>Проєкти</span></a>
        <a href="Files Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:9999px; padding:6px 12px; font-size:13px; font-weight:600; background:#B7EE7A; color:#1E3A12;"><i data-lucide="folder-open" style="width:16px;height:16px"></i><span>Файли</span></a>
        <a href="Org Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:6px; padding:6px 10px; font-size:13px; font-weight:500; color:#8B9C86;"><i data-lucide="network" style="width:16px;height:16px"></i><span>Оргсхема</span></a>
        <a href="Team Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:6px; padding:6px 10px; font-size:13px; font-weight:500; color:#8B9C86;"><i data-lucide="users-round" style="width:16px;height:16px"></i><span>Команда</span></a>
        <a href="Reports Dark.dc.html" style="display:flex; align-items:center; gap:6px; border-radius:6px; padding:6px 10px; font-size:13px; font-weight:500; color:#8B9C86;"><i data-lucide="bar-chart-3" style="width:16px;height:16px"></i><span>Звіти</span></a>
      </nav>
    </div>
    <div style="display:flex; flex-shrink:0; align-items:center; gap:4px;">
      <button style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; border:0; background:transparent; border-radius:8px; color:#8B9C86; cursor:pointer;"><i data-lucide="search" style="width:16px;height:16px"></i></button>
      <button style="position:relative; display:flex; align-items:center; justify-content:center; width:32px; height:32px; border:0; background:transparent; border-radius:8px; color:#8B9C86; cursor:pointer;">
        <i data-lucide="bell" style="width:16px;height:16px"></i>
        <span style="position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%; background:#A9D97F;"></span>
      </button>
      <button style="display:flex; align-items:center; gap:8px; border:0; background:transparent; padding:0 2px 0 6px; cursor:pointer;">
        <span style="width:28px; height:28px; border-radius:50%; background:#22331F; color:#A9D97F; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600;">АД</span>
        <i data-lucide="chevron-down" style="width:14px;height:14px;color:#8B9C86"></i>
      </button>
    </div>
  </header>

  <main style="flex:1;">
    <div style="margin:0 auto; max-width:896px; padding:32px 24px;">
      <div style="display:flex; flex-direction:column; gap:32px;">

        <div style="border-radius:12px; border:1px solid #232E20; background:#131C15; padding:16px;">
          <div style="display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px;">
            <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
              <label style="font-size:11px; color:#8B9C86;">Назва</label>
              <div style="display:flex; height:32px; align-items:center; border-radius:6px; border:1px solid #232E20; padding:0 10px; font-size:13px; color:#6E7C6A;">Бренд-бук</div>
            </div>
            <div style="flex:2; display:flex; flex-direction:column; gap:4px;">
              <label style="font-size:11px; color:#8B9C86;">Посилання <span style="color:#6E7C6A;">(або завантажте файл)</span></label>
              <div style="display:flex; height:32px; align-items:center; border-radius:6px; border:1px solid #232E20; padding:0 10px; font-size:13px; color:#6E7C6A;">https://…</div>
            </div>
            <button style="display:inline-flex; align-items:center; gap:6px; height:32px; border:0; border-radius:9999px; background:#B7EE7A; padding:0 12px; font:inherit; font-size:13px; font-weight:500; color:#1E3A12; cursor:pointer;"><i data-lucide="upload" style="width:16px;height:16px"></i> Завантажити файл</button>
            <span style="display:inline-flex; flex-shrink:0; border-radius:9999px; padding:1.5px; background:#B7EE7A; animation:btnglow2 6s ease-in-out infinite;"><button style="display:inline-flex; align-items:center; height:32px; border:0; border-radius:9999px; background:#16211A; padding:0 14px; font:inherit; font-size:13px; font-weight:600; color:#E8EFE3; cursor:pointer;">Додати</button></span>
          </div>
          <p style="margin:8px 0 0; font-size:11px; color:#8B9C86;">Додайте <b>посилання</b> (назва + URL → «Додати посилання») <b>або</b> завантажте <b>файл</b> — щось одне. Файли бачить уся команда.</p>
          <div style="margin-top:8px; display:flex; align-items:center; gap:8px; border-radius:8px; border:1px solid #232E20; background:#16211A; padding:6px 12px; font-size:13px;">
            <span style="display:flex; width:16px; height:16px; flex-shrink:0; align-items:center; justify-content:center; border-radius:50%; background:#A9D97F; color:#fff;"><i data-lucide="check" style="width:12px;height:12px"></i></span>
            <i data-lucide="file-text" style="width:16px;height:16px;color:#8B9C86;flex-shrink:0"></i>
            <span style="min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Презентація для замовника.pdf</span>
            <span style="flex-shrink:0; font-size:11px; color:#A9D97F;">Готово</span>
            <i data-lucide="x" style="width:14px;height:14px;color:#8B9C86;flex-shrink:0"></i>
          </div>
        </div>

        <div>
          <h2 style="margin:0 0 12px; font-size:13px; font-weight:600;">Файли команди</h2>
          <div style="display:flex; flex-direction:column; gap:6px;">

            <div style="display:flex; align-items:center; gap:8px; border-radius:8px; border:1px solid #232E20; background:#131C15; padding:8px 12px;">
              <i data-lucide="link" style="width:16px;height:16px;color:#8B9C86"></i>
              <a href="#" style="min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:#E8EFE3;">Бренд-бук.pdf</a>
              <span style="font-size:11px; color:#8B9C86;">ви</span>
              <i data-lucide="copy" style="width:16px;height:16px;color:#8B9C86"></i>
              <i data-lucide="x" style="width:14px;height:14px;color:#8B9C86"></i>
            </div>

            <div style="display:flex; align-items:center; gap:8px; border-radius:8px; border:1px solid #232E20; background:#131C15; padding:8px 12px;">
              <i data-lucide="link" style="width:16px;height:16px;color:#8B9C86"></i>
              <a href="#" style="min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:#E8EFE3;">Договір.pdf</a>
              <span style="font-size:11px; color:#8B9C86;">Admin</span>
              <i data-lucide="copy" style="width:16px;height:16px;color:#8B9C86"></i>
            </div>

            <div style="display:flex; align-items:center; gap:8px; border-radius:8px; border:1px solid #232E20; background:#131C15; padding:8px 12px;">
              <i data-lucide="file-text" style="width:16px;height:16px;color:#8B9C86"></i>
              <button style="min-width:0; flex:1; border:0; background:transparent; padding:0; text-align:left; font:inherit; font-size:13px; color:#E8EFE3; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Презентація для замовника.pdf</button>
              <span style="font-size:11px; color:#8B9C86;">ви</span>
              <i data-lucide="eye" style="width:16px;height:16px;color:#8B9C86"></i>
              <i data-lucide="copy" style="width:16px;height:16px;color:#8B9C86"></i>
              <i data-lucide="x" style="width:14px;height:14px;color:#8B9C86"></i>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <span style="position:fixed; bottom:24px; left:24px; z-index:50; display:inline-flex; border-radius:50%; padding:1.5px; background:#B7EE7A; animation:btnglow 6s ease-in-out infinite;"><button style="display:flex; width:53px; height:53px; align-items:center; justify-content:center; border:0; border-radius:50%; color:#E8EFE3; background:#16211A; cursor:pointer;">
    <i data-lucide="plus" style="width:28px;height:28px"></i>
  </button></span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  icons() { try { window.lucide && window.lucide.createIcons(); } catch (e) {} }
  componentDidMount() {
    this.icons();
    this._t = [80, 300, 900, 2000].map((ms) => setTimeout(() => this.icons(), ms));
  }
  componentDidUpdate() { this.icons(); }
  componentWillUnmount() { (this._t || []).forEach(clearTimeout); }
}
</script>
</body>
</html>
