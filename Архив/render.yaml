services:
  # Luma Phrase Trainer — полностью бесплатная схема:
  # Render Free (без persistent-диска) + Neon Postgres (free tier).
  # Провайдер Prisma-схемы подменяется на postgresql на этапе сборки (sed) —
  # локальная разработка остаётся на SQLite. Кэш озвучки живёт в БД (TtsCache).
  - type: web
    name: luma-trainer
    env: node
    plan: free
    region: frankfurt # рядом с Neon (eu-central-1), иначе каждый запрос к БД летит через океан
    buildCommand: cd luma-trainer && npm install && sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npx prisma generate && npm run build
    startCommand: cd luma-trainer && npx prisma db push && npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # postgres://… из Neon (free)
      - key: NODE_VERSION
        value: 22.23.2
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

# Легаси-сервисы прежних проектов (платные планы с дисками) убраны из блюпринта,
# чтобы Render не требовал карту. Их конфиги — в истории git при необходимости.
