<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочий стол — прототип v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --porcelain:#EDF0EE;--card:#FFFFFF;--ink:#111618;--ink-2:#5A6469;--ink-3:#95A0A3;
  --line:#DCE1DF;--line-2:#EAEEEC;--teal:#0F6B5F;--teal-soft:#E3EEEB;--amber:#A9670F;--miss:#C98B8B;
  --serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--porcelain);height:100%}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:2px}
.app{display:grid;grid-template-columns:230px 1fr 336px;min-height:100vh}

/* ── рейка ─────────────────────────── */
aside{border-right:1px solid var(--line);padding:22px 14px;background:#F4F6F5}
.cap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 6px 10px}
.nav-item{display:block;width:100%;padding:9px 10px;border-radius:4px;margin-bottom:2px;transition:background .15s}
.nav-item:hover{background:#E9EDEB}
.nav-item.sel{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.nav-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nav-top b{font-weight:450;font-size:13.5px}
.nav-top i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.track{height:3px;background:#DFE4E1;border-radius:2px;overflow:hidden;margin-top:7px}
.track>i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .45s cubic-bezier(.22,.8,.3,1)}
.today-nav{margin-bottom:14px;padding:11px 10px}
.today-nav b{font-size:14.5px;font-weight:500}
.add{width:100%;margin-top:12px;padding:9px;border:1px dashed var(--line);border-radius:4px;
     font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:center}

/* ── центр ─────────────────────────── */
main{padding:26px 30px 40px;min-width:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:6px}
.head h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;margin:0}
.left{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.wk{display:flex;gap:4px;align-items:center;margin:16px 0 26px}
.wk div{flex:1;height:3px;background:#DEE3E0;border-radius:2px;position:relative}
.wk div>i{position:absolute;inset:0;background:var(--ink);border-radius:2px;transform-origin:left;transition:transform .5s}
.wk div.now{height:6px}
.wk div.now>i{background:var(--teal)}
.wk span{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-left:8px;white-space:nowrap}

.list{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:16px;padding:17px 2px;border-bottom:1px solid var(--line-2)}
.box{width:20px;height:20px;flex:0 0 auto;border:1.5px solid var(--ink-2);border-radius:3px;display:grid;place-items:center;
     transition:background .16s,border-color .16s}
.box svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:opacity .16s,transform .2s cubic-bezier(.3,1.4,.5,1)}
.done .box{background:var(--teal);border-color:var(--teal)}
.done .box svg{opacity:1;transform:scale(1)}
.lab{flex:1;min-width:0;font-size:19px;letter-spacing:-.01em}
.done .lab{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.tag{font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:100px;padding:3px 9px;white-space:nowrap}
.due{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);width:56px;text-align:right}
.empty{padding:30px 0;color:var(--ink-2);font-size:15px}
.empty b{display:block;font-family:var(--serif);font-size:25px;font-weight:400;color:var(--ink);margin-bottom:5px}
.donebar{margin-top:16px;font-size:13px;color:var(--ink-3)}
.donebar button{text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}

/* ── ближайшие дни ─────────────────── */
.ahead{margin-top:38px;border-top:1px solid var(--line);padding-top:18px}
.ahead-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.ahead-h b{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.ahead-h i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.col{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 9px 11px;min-height:96px}
.col.load{border-color:#C9D2CE}
.col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.col-h u{text-decoration:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.col-h em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.mini{font-size:11.5px;line-height:1.45;color:var(--ink-2);padding:3px 0;border-top:1px dashed var(--line-2);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini:first-of-type{border-top:0}
.more{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:4px}

/* ── привычки ──────────────────────── */
.rail{border-left:1px solid var(--line);background:#F4F6F5;padding:24px 18px}
.hbox{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px 14px}
.hbox-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.hbox-h b{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.hbox-h i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.hab{padding:12px 0;border-top:1px solid var(--line-2)}
.hab:first-of-type{border-top:0;padding-top:0}
.hab-n{font-size:13.5px;margin-bottom:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hab-n u{text-decoration:none;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.days{display:flex;align-items:center;gap:5px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px}
.day u{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.day.now u{color:var(--teal)}
.cell{width:22px;height:22px;border:1.4px solid var(--line);border-radius:4px;display:grid;place-items:center;
      transition:background .16s,border-color .16s}
.cell svg{width:10px;height:10px;opacity:0;transition:opacity .16s}
.cell.hit{background:var(--teal);border-color:var(--teal)}
.cell.hit svg{opacity:1}
.cell.miss{border-color:#E6CFCF;color:var(--miss);font-size:10px;font-family:var(--mono)}
.day.now .cell{border-width:2px;border-color:var(--ink-2)}
.day.now .cell.hit{border-color:var(--teal)}
.cell.fut{border-style:dashed;border-color:#E4E9E6;cursor:default;background:#FBFCFB}
.streak{margin-left:auto;text-align:right;white-space:nowrap}
.streak b{display:block;font-family:var(--mono);font-size:15px;font-weight:500;color:var(--amber);line-height:1.1}
.streak u{text-decoration:none;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.06em}
.note{margin-top:14px;font-size:11.5px;line-height:1.55;color:var(--ink-3)}

@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  aside,.rail{border:0;border-top:1px solid var(--line)}
  .cols{grid-template-columns:repeat(3,1fr)}
  main{padding:22px 18px}
  .head h1{font-size:30px}
  .lab{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <button class="nav-item today-nav sel" data-nav="today"><span class="nav-top"><b>Сегодня</b><i id="navLeft"></i></span></button>
    <div class="cap">Направления</div>
    <div id="nav"></div>
    <div class="add">+ направление</div>
  </aside>

  <main>
    <div class="head">
      <h1 id="title">Понедельник, 17 марта</h1>
      <div class="left" id="left"></div>
    </div>
    <div class="wk" id="wk"></div>
    <div class="list" id="list"></div>
    <div class="donebar" id="donebar"></div>

    <section class="ahead">
      <div class="ahead-h"><b>Осталось на этой неделе</b><i id="aheadSum"></i></div>
      <div class="cols" id="cols"></div>
    </section>
  </main>

  <div class="rail">
    <div class="hbox">
      <div class="hbox-h"><b>Привычки</b><i id="habSum"></i></div>
      <div id="habs"></div>
      <div class="note">Три дня назад можно доотметить, будущие — только план. Серия считается подряд от сегодня назад.</div>
    </div>
  </div>
</div>

<script>
var TICK='<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.3 4.6 9 10 3.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var TODAY=0;                        // сегодня — понедельник

function hist(p){var a=[];for(var i=0;i<30;i++)a.push(p[i%p.length]);return a}

var data={
  week:[null,null,null,null,null,null,null],
  dirs:[
   {id:'health',name:'Здоровье',goals:[
    {name:'Набрать 5 кг',tasks:[
      {t:'Тренировка',d:0,h:'18:00',done:false},
      {t:'Закупить продукты',d:2,done:false},
      {t:'Записаться к тренеру',d:4,done:false},
      {t:'Замеры и взвешивание',d:6,done:false},
      {t:'План питания',d:-1,done:true},{t:'Абонемент',d:-1,done:true},{t:'Анализы',d:-1,done:true}],
     habits:[{n:'Силовая тренировка',log:hist([1,1,0,1,1,1,0])},{n:'150 г белка',log:hist([1,1,1,0,1,0,1])}]},
    {name:'Режим сна',tasks:[{t:'Шторы блэкаут',d:1,done:false},{t:'Телефон из спальни',d:-1,done:true}],
     habits:[{n:'Отбой до 23:30',log:hist([1,0,1,1,0,0,1])}]}]},
   {id:'edu',name:'Образование',goals:[
    {name:'Английский B2',tasks:[
      {t:'Урок английского',d:0,h:'20:00',done:false},
      {t:'Домашнее задание',d:1,done:false},{t:'Оплатить месяц',d:3,done:false},
      {t:'Пробный тест',d:-1,done:true},{t:'Выбрать препода',d:-1,done:true}],
     habits:[{n:'20 минут чтения',log:hist([1,1,1,1,1,1,0])}]},
    {name:'Курс аналитики',tasks:[{t:'Модуль 3',d:4,done:false},{t:'Модуль 4',d:6,done:false},{t:'Оплатить курс',d:-1,done:true},{t:'Модуль 5',d:-1,done:false}],habits:[]}]},
   {id:'family',name:'Семья',goals:[
    {name:'Больше времени вместе',tasks:[
      {t:'Позвонить родителям',d:0,h:'21:00',done:false},
      {t:'Столик на субботу',d:2,done:false},{t:'Фотоархив',d:-1,done:true}],
     habits:[{n:'Ужин без телефонов',log:hist([1,1,1,1,0,1,1])}]}]},
   {id:'work',name:'Работа',goals:[
    {name:'Запуск лендинга',tasks:[
      {t:'Закончить презентацию',d:0,h:'17:00',done:false},
      {t:'Согласовать тексты',d:1,done:false},{t:'Бриф на дизайн',d:-1,done:true},{t:'Аналитика',d:-1,done:true}],habits:[]},
    {name:'Найм в команду',tasks:[{t:'Отсмотреть 5 резюме',d:2,done:false},{t:'Собес с кандидатом',d:3,done:false},
      {t:'Описать вакансию',d:-1,done:true},{t:'Опубликовать',d:-1,done:true},{t:'Вилка',d:-1,done:true}],habits:[]}]},
   {id:'money',name:'Финансы',goals:[
    {name:'Подушка 6 мес.',tasks:[{t:'Перевести в накопления',d:1,done:false},{t:'Открыть счёт',d:-1,done:true}],
     habits:[{n:'Записать траты дня',log:hist([1,0,1,1,0,1,1])}]},
    {name:'Учёт расходов',tasks:[{t:'Внести расходы за неделю',d:0,h:'22:00',done:false},{t:'Категории',d:-1,done:true},{t:'Отчёт за февраль',d:5,done:false}],habits:[]}]}
  ]};

var view='today', showDone=false;

/* ── расчёт ───────────────────────── */
function rate(l){var s=0;for(var i=0;i<l.length;i++)s+=l[i];return s/l.length}
function goalPct(g){
  var t=g.tasks.length?g.tasks.filter(function(x){return x.done}).length/g.tasks.length:0;
  if(!g.habits.length)return Math.round(t*100);
  var h=0;g.habits.forEach(function(x){h+=rate(x.log)});h/=g.habits.length;
  return Math.round((t*.7+h*.3)*100);
}
function dirPct(d){var s=0;d.goals.forEach(function(g){s+=goalPct(g)});return Math.round(s/d.goals.length)}
function scope(){return view==='today'?data.dirs:data.dirs.filter(function(d){return d.id===view})}
function tasksAt(day){
  var o=[];scope().forEach(function(d){d.goals.forEach(function(g){g.tasks.forEach(function(t){
    if(t.d===day)o.push({dir:d,ref:t});});});});return o;
}
function habitsAll(){
  var o=[];scope().forEach(function(d){d.goals.forEach(function(g){g.habits.forEach(function(h){
    o.push({dir:d,ref:h});});});});return o;
}
function todayPct(){
  var t=tasksAt(TODAY),h=habitsAll(),n=t.length+h.length;if(!n)return 0;
  var k=t.filter(function(x){return x.ref.done}).length+h.filter(function(x){return x.ref.log[29]===1}).length;
  return k/n;
}
function streak(h){var s=0;for(var i=29;i>=0;i--){if(h.log[i])s++;else break}return s}

/* ── отрисовка ────────────────────── */
function draw(){
  /* рейка */
  document.getElementById('nav').innerHTML=data.dirs.map(function(d){
    var p=dirPct(d);
    return '<button class="nav-item'+(view===d.id?' sel':'')+'" data-nav="'+d.id+'">'+
      '<span class="nav-top"><b>'+d.name+'</b><i>'+p+'%</i></span>'+
      '<span class="track"><i style="width:'+p+'%"></i></span></button>';
  }).join('');
  document.querySelectorAll('[data-nav]').forEach(function(b){
    b.onclick=function(){view=b.dataset.nav;showDone=false;draw()};
  });
  document.querySelector('.today-nav').classList.toggle('sel',view==='today');

  /* заголовок */
  var d=data.dirs.filter(function(x){return x.id===view})[0];
  document.getElementById('title').textContent = d? d.name : 'Понедельник, 17 марта';

  /* сегодня */
  var items=tasksAt(TODAY), open=items.filter(function(x){return !x.ref.done}),
      done=items.filter(function(x){return x.ref.done});
  var L=document.getElementById('list');
  if(!open.length&&!showDone){
    L.innerHTML='<div class="empty"><b>На сегодня всё</b>Ближайшее — во вторник, ниже.</div>';
  }else{
    L.innerHTML=open.concat(showDone?done:[]).map(function(x){
      return '<div class="item'+(x.ref.done?' done':'')+'" data-t="'+items.indexOf(x)+'">'+
        '<button class="box">'+TICK+'</button><span class="lab">'+x.ref.t+'</span>'+
        (view==='today'?'<span class="tag">'+x.dir.name+'</span>':'')+
        '<span class="due">'+(x.ref.h||'')+'</span></div>';
    }).join('');
    L.querySelectorAll('.item').forEach(function(r){
      r.querySelector('.box').onclick=function(){items[+r.dataset.t].ref.done=!items[+r.dataset.t].ref.done;draw()};
    });
  }
  document.getElementById('left').textContent=open.length?'осталось '+open.length:'всё закрыто';
  document.getElementById('navLeft').textContent=(function(){
    var a=[];data.dirs.forEach(function(dd){dd.goals.forEach(function(g){g.tasks.forEach(function(t){
      if(t.d===TODAY&&!t.done)a.push(1)})})});return a.length||'✓';})();
  document.getElementById('donebar').innerHTML=done.length?
    'Сделано: '+done.length+' · <button id="td">'+(showDone?'скрыть':'показать')+'</button>':'';
  if(document.getElementById('td'))document.getElementById('td').onclick=function(){showDone=!showDone;draw()};

  /* линия недели */
  data.week[TODAY]=todayPct();
  var sum=0,n=0;
  document.getElementById('wk').innerHTML=DAYS.map(function(dd,i){
    var v=data.week[i];if(v!==null){sum+=v;n++}
    return '<div class="'+(i===TODAY?'now':'')+'"><i style="transform:scaleX('+(v||0)+')"></i></div>';
  }).join('')+'<span>неделя '+(n?Math.round(sum/n*100)+'%':'—')+'</span>';

  /* ближайшие дни */
  var total=0;
  document.getElementById('cols').innerHTML=[1,2,3,4,5,6].map(function(i){
    var ts=tasksAt(i).filter(function(x){return !x.ref.done});
    total+=ts.length;
    return '<div class="col'+(ts.length>2?' load':'')+'"><div class="col-h"><u>'+DAYS[i]+'</u><em>'+(ts.length||'')+'</em></div>'+
      ts.slice(0,3).map(function(x){return '<div class="mini">'+x.ref.t+'</div>'}).join('')+
      (ts.length>3?'<div class="more">+'+(ts.length-3)+'</div>':'')+'</div>';
  }).join('');
  document.getElementById('aheadSum').textContent=total+' задач до воскресенья';

  /* привычки: 3 до / сегодня / 3 после */
  var hs=habitsAll();
  document.getElementById('habSum').textContent=hs.filter(function(x){return x.ref.log[29]===1}).length+' / '+hs.length+' сегодня';
  document.getElementById('habs').innerHTML=hs.map(function(x,idx){
    var cells='';
    for(var off=-3;off<=3;off++){
      var di=(TODAY+off+7)%7, lab=DAYS[di], i=29+off;
      if(off>0){
        cells+='<div class="day"><u>'+lab+'</u><div class="cell fut"></div></div>';
      }else{
        var on=x.ref.log[i]===1;
        cells+='<div class="day'+(off===0?' now':'')+'"><u>'+lab+'</u>'+
          '<button class="cell '+(on?'hit':'miss')+'" data-h="'+idx+'" data-o="'+off+'">'+(on?TICK:'✕')+'</button></div>';
      }
    }
    return '<div class="hab"><div class="hab-n"><span>'+x.ref.n+'</span>'+
      (view==='today'?'<u>'+x.dir.name+'</u>':'')+'</div>'+
      '<div class="days">'+cells+'<span class="streak"><b>'+streak(x.ref)+'</b><u>дней</u></span></div></div>';
  }).join('');
  document.querySelectorAll('.cell[data-h]').forEach(function(c){
    c.onclick=function(){
      var h=hs[+c.dataset.h].ref, i=29+(+c.dataset.o);
      h.log[i]=h.log[i]?0:1; draw();
    };
  });
}
draw();
</script>
</body>
</html>
