<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luma — нет сети</title>
    <style>
      body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f6f7fb; color: #282e3e; display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
      .dot { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #51cfff, #4255ff); margin: 0 auto 16px; }
      h1 { font-size: 22px; } p { color: #586380; }
      button { margin-top: 16px; min-height: 44px; padding: 0 20px; border-radius: 10px; border: none; background: #4255ff; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div>
      <div class="dot"></div>
      <h1>Нет подключения к сети</h1>
      <p>Luma откроется снова, как только появится интернет.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
