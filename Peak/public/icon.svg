<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4eca9"/>
      <stop offset="0.5" stop-color="#e9f1cb"/>
      <stop offset="1" stop-color="#74c6b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="250" cy="240" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf8dc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fdf8dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="360" y1="180" x2="200" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b6a4e"/>
      <stop offset="0.55" stop-color="#2f9a78"/>
      <stop offset="1" stop-color="#5fbfae"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#glow)"/>

  <!-- orbit / goal ring -->
  <g fill="none" stroke="#6cbf59" stroke-width="15" stroke-linecap="round">
    <path d="M 188 158 A 150 150 0 0 1 372 206"/>
    <path d="M 138 232 A 150 150 0 0 0 158 372"/>
    <path d="M 398 320 A 150 150 0 0 1 300 438"/>
  </g>
  <circle cx="168" cy="196" r="18" fill="#3f9a5f"/>

  <!-- rising road (split trail) -->
  <path d="M 150 452 C 186 356, 250 300, 372 236" fill="none" stroke="url(#arrow)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <!-- main rising arrow shaft -->
  <path d="M 214 452 C 232 356, 292 296, 392 222" fill="none" stroke="url(#arrow)" stroke-width="52" stroke-linecap="round"/>

  <!-- arrowhead pointing up-right -->
  <path fill="url(#arrow)" d="M 452 168 L 356 190 L 380 232 L 322 288 L 356 322 L 414 266 L 438 308 Z"/>
</svg>
