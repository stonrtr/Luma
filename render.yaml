services:
  - type: web
    name: top-superfoods-tracker
    env: python
    plan: starter
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn --chdir server --bind 0.0.0.0:$PORT app:app
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: luma-trainer
    env: node
    plan: starter
    buildCommand: cd luma-trainer && npm install && npx prisma generate && npm run build
    startCommand: cd luma-trainer && npx prisma db push && npm run start
    disk:
      name: luma-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/luma.db
      - key: TTS_CACHE_DIR
        value: /var/data/tts-cache
      - key: NODE_VERSION
        value: 22.23.2
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

  - type: web
    name: task-tracker
    env: node
    plan: starter
    buildCommand: cd task-tracker && npm install && npx prisma migrate deploy && npm run build
    startCommand: cd task-tracker && npm run start
    disk:
      name: task-tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: NODE_VERSION
        value: 22.23.2
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
